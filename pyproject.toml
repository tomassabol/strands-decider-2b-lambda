[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "RUF", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["function"]

[tool.ruff.lint.isort]
known-first-party = ["strands_decider", "backend", "conftest"]
